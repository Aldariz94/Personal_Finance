name: Construir .exe de Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Construir ejecutable
        run: pyinstaller --noconfirm --clean MisFinanzas.spec

      - name: Comprimir
        run: Compress-Archive -Path dist/MisFinanzas -DestinationPath MisFinanzas-windows.zip

      - name: Subir artefacto (ejecución manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MisFinanzas-windows
          path: MisFinanzas-windows.zip

      - name: Publicar release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" MisFinanzas-windows.zip `
            --title "Mis Finanzas ${{ github.ref_name }}" `
            --notes "Descarga MisFinanzas-windows.zip, descomprímelo y haz doble clic en MisFinanzas.exe. Tus datos quedan en la carpeta MisFinanzas de tu usuario, así que actualizar de versión no los toca."
